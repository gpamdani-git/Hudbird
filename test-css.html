<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --success-50: 158 64% 97%;
    --success-soft: hsl(var(--success-50));
    --color-success-soft: var(--success-soft);
  }
  .bg-success-soft {
    background-color: var(--color-success-soft);
  }
</style>
</head>
<body>
  <div class="bg-success-soft" style="width: 100px; height: 100px; border: 1px solid black;">Test</div>
  <script>
    const el = document.querySelector('.bg-success-soft');
    console.log(window.getComputedStyle(el).backgroundColor);
  </script>
</body>
</html>
