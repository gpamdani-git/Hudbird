<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Hudbird UI - Fly through your development</title>
    <meta
      name="description"
      content="A premium, featherweight UI Component Library built with React, TypeScript, and Tailwind CSS."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7ELTSPERKY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7ELTSPERKY');
    </script>

    <script id="theme-script">
      try {
        var theme = localStorage.getItem("theme") || "system";
        if (
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (_) {}

      window.addEventListener("error", function (e) {
        if (
          e.message &&
          (e.message.indexOf("ResizeObserver loop") !== -1 ||
            e.message.indexOf("undelivered notifications") !== -1)
        ) {
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body
    class="bg-zinc-50 text-zinc-900 antialiased selection:bg-blue-500 selection:text-white dark:bg-zinc-950 dark:text-zinc-50"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
